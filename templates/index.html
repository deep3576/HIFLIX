<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    
    <head>
        <title>File Upload with Dynamic Chunking</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f9;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
    
            .container {
                background: #ffffff;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                padding: 20px;
                max-width: 500px;
                width: 100%;
                text-align: center;
                margin-top: 30px;
            }
    
            h1 {
                margin-bottom: 20px;
                color: #333;
            }
    
            input[type="file"] {
                margin-bottom: 20px;
                display: inline-block;
                color: #333;
            }
    
            button {
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                transition: background-color 0.3s;
            }
    
            button:disabled {
                background-color: #6c757d;
                cursor: not-allowed;
            }
    
            button:hover:not(:disabled) {
                background-color: #0056b3;
            }
    
            #statusMessage {
                margin-top: 10px;
                font-size: 16px;
                color: #333;
            }

            #estimatedTime {
                font-size: 11px;
                color: #333;
            }
    
            progress {
                width: 100%;
                height: 20px;
                margin-top: 10px;
                border-radius: 4px;
                appearance: none;
            }
    
            progress::-webkit-progress-bar {
                background-color: #e9ecef;
                border-radius: 4px;
            }
    
            progress::-webkit-progress-value {
                background-color: #007bff;
                border-radius: 4px;
            }
    
            .error {
                color: #dc3545;
            }
    
            .success {
                color: #28a745;
            }
        </style>
    </head>
    
    <body>
        <body>
            <div class="container">
                <h1>Upload File</h1>
                <input type="file" id="fileInput" />
                <button id="uploadButton">Upload</button>
                <div id="statusMessage"></div>
                <progress id="progressBar" value="0" max="100"></progress>
                <div id="estimatedTime"></div>
            </div>
            <script>
                const INITIAL_CHUNK_SIZE = 1024 * 1024; // Start with 1 MB
                const MAX_CHUNK_SIZE = 10 * 1024 * 1024; // Max 10 MB
                const MIN_CHUNK_SIZE = 100 * 1024; // Min 512 KB
        
                async function uploadFileInChunks(file) {
                    let chunkSize = INITIAL_CHUNK_SIZE;
                    let start = 0;
                    let totalChunks = Math.ceil(file.size / chunkSize);
                    let uploadUrl = '/upload'; // Your server endpoint
                    const statusMessage = document.getElementById('statusMessage');
                    const progressBar = document.getElementById('progressBar');
                    const estimatedTimeDiv = document.getElementById('estimatedTime');
        
                    let startTime = Date.now();
        
                    while (start < file.size) {
                        const end = Math.min(start + chunkSize, file.size);
                        const chunk = file.slice(start, end);
                        const formData = new FormData();
                        formData.append('file', chunk);
                        formData.append('start', start);
        
                        try {
                            const uploadStartTime = Date.now();
                            const response = await fetch(uploadUrl, {
                                method: 'POST',
                                body: formData
                            });
        
                            if (!response.ok) {
                                throw new Error('Upload failed');
                            }
        
                            const uploadEndTime = Date.now();
                            const uploadTime = uploadEndTime - uploadStartTime;
                            const currentPosition = end;
                            const timeElapsed = uploadEndTime - startTime;
                            const totalSize = file.size;
                            const uploadedSize = currentPosition;
                            const averageSpeed = uploadedSize / timeElapsed;
                            const remainingSize = totalSize - uploadedSize;
                            const remainingTime = Math.ceil(remainingSize / averageSpeed);
        
                            // Update progress
                            start = end;
                            const percentComplete = (start / file.size) * 100;
                            progressBar.value = percentComplete;
        
                            // Update estimated time
                            estimatedTimeDiv.textContent = `Remaining Time: ${formatTime(remainingTime)}`;
        
                        } catch (error) {
                            statusMessage.textContent = `Upload error: ${error.message}`;
                            statusMessage.className = 'error';
                            return;
                        }
                    }
        
                    statusMessage.textContent = 'File uploaded successfully';
                    statusMessage.className = 'success';
        
                    // Redirect to home page after upload is complete
                    setTimeout(() => {
                        window.location.href = '/'; // Redirect to home page
                    }, 1000); // Delay to ensure the status message is visible
                }
        
                function formatTime(milliseconds) {
                    const seconds = Math.floor(milliseconds / 1000);
                    const minutes = Math.floor(seconds / 60);
                    const hours = Math.floor(minutes / 60);
                    return `${hours}h ${minutes % 60}m ${seconds % 60}s`;
                }
        
                document.getElementById('uploadButton').addEventListener('click', async function() {
                    const fileInput = document.getElementById('fileInput');
                    const file = fileInput.files[0];
                    const uploadButton = document.getElementById('uploadButton');
                    const statusMessage = document.getElementById('statusMessage');
                    const progressBar = document.getElementById('progressBar');
                    const estimatedTimeDiv = document.getElementById('estimatedTime');
        
                    if (file) {
                        uploadButton.disabled = true;
                        statusMessage.textContent = 'Uploading file...';
                        estimatedTimeDiv.textContent = ''; // Clear any previous estimated time
        
                        await uploadFileInChunks(file);
        
                        // Reset status and button after upload
                        uploadButton.disabled = false;
                    } else {
                        alert('No file selected');
                    }
                });
            </script>
        


     </body>
</head>
<body>
    <div id="app">
        <h1>Welcome to Hi Flix </h1>
        <div id="movies-list" class="movie-grid"></div>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
<footer>
    <p>&copy Developed by Inderdeep Singh</p>
</footer>
</html>
