<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <h1>Upload File</h1>
    <input type="file" id="fileInput" />
    <button id="uploadButton">Upload</button>
    <progress id="progressBar" value="0" max="100" style="width: 100%; margin-top: 10px;"></progress>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.4/pako.min.js"></script>
    <script>
        document.getElementById('uploadButton').addEventListener('click', async function() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();

                reader.onload = function(event) {
                    // Compress the file data using pako
                    const compressedData = pako.gzip(new Uint8Array(event.target.result));
                    
                    // Create a new FormData object and append the compressed file data
                    const formData = new FormData();
                    formData.append('file', new Blob([compressedData], { type: 'application/gzip' }), file.name + '.gz');

                    // Upload the compressed file
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/upload', true);

                    xhr.upload.onprogress = function(event) {
                        if (event.lengthComputable) {
                            const percentComplete = (event.loaded / event.total) * 100;
                            document.getElementById('progressBar').value = percentComplete;
                        }
                    };

                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            alert('File uploaded successfully');
                        } else {
                            alert('Upload failed');
                        }
                    };

                    xhr.onerror = function() {
                        alert('Upload error');
                    };

                    xhr.send(formData);
                };

                reader.readAsArrayBuffer(file);
            } else {
                alert('No file selected');
            }
        });
    </script>
</head>
<body>
    <div id="app">
        <h1>Welcome to Hi Flix </h1>
        <div id="movies-list" class="movie-grid"></div>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
<footer>
    <p>&copy Developed by Inderdeep Singh</p>
</footer>
</html>
