<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <h1>Upload File</h1>
    <input type="file" id="fileInput" />
    <button id="uploadButton">Upload</button>
    <div id="statusMessage"></div>
    <progress id="progressBar" value="0" max="100" style="width: 100%; margin-top: 10px;"></progress>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.4/pako.min.js"></script>
    <script>
        const CHUNK_SIZE = 1024 * 1024; // 1 MB

        async function uploadFileInChunks(file) {
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            const uploadUrl = '/upload'; // Your server endpoint
            const statusMessage = document.getElementById('statusMessage');
            const progressBar = document.getElementById('progressBar');

            for (let start = 0; start < file.size; start += CHUNK_SIZE) {
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunk = file.slice(start, end);
                const formData = new FormData();
                formData.append('file', chunk, 'chunk.gz'); // Give a name to each chunk

                try {
                    const response = await fetch(uploadUrl, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const uploadedChunks = Math.ceil(end / CHUNK_SIZE);
                        const percentComplete = (uploadedChunks / totalChunks) * 100;
                        progressBar.value = percentComplete;
                    } else {
                        throw new Error('Upload failed');
                    }
                } catch (error) {
                    statusMessage.textContent = `Upload error: ${error.message}`;
                    return;
                }
            }
            statusMessage.textContent = 'File uploaded and decompressed successfully';
        }

        document.getElementById('uploadButton').addEventListener('click', async function() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const uploadButton = document.getElementById('uploadButton');
            const statusMessage = document.getElementById('statusMessage');
            const progressBar = document.getElementById('progressBar');

            if (file) {
                uploadButton.disabled = true;
                statusMessage.textContent = 'Compressing file...';

                const reader = new FileReader();

                reader.onload = async function(event) {
                    // Compress the file data using pako
                    const compressedData = pako.gzip(new Uint8Array(event.target.result));
                    const compressedBlob = new Blob([compressedData], { type: 'application/gzip' });

                    statusMessage.textContent = 'Uploading file...';
                    await uploadFileInChunks(compressedBlob);

                    // Reset status and button after upload
                    uploadButton.disabled = false;
                };

                reader.readAsArrayBuffer(file);
            } else {
                alert('No file selected');
            }
        });
    </script>

</head>
<body>
    <div id="app">
        <h1>Welcome to Hi Flix </h1>
        <div id="movies-list" class="movie-grid"></div>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
<footer>
    <p>&copy Developed by Inderdeep Singh</p>
</footer>
</html>
