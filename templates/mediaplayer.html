<!DOCTYPE html>
<html>
<head>
    <title>Media Player</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            color: #fff;
            margin: 0;
        }
        video {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <video id="mediaPlayer" controls>
        <source src="/media/sample.mp4" type="video/mp4"> <!-- Adjust the source as needed -->
        Your browser does not support the video tag.
    </video>
</body>
</html>
